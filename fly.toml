app = "bot-wa"          # ganti dengan nama app kamu
primary_region = "sin"    # Singapore — paling dekat Indonesia

[build]

[env]
NODE_ENV = "production"

# Tidak butuh HTTP server, ini bot jalan terus (worker)
[[services]]

[mounts]
  source = "wa_session"
  destination = "/app/session"   # Session WA disimpan di volume persistent
